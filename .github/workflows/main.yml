name: Python package

on:
  push:
    branches:
      - master
      - 2.5
      - 3.x
      - 5.x
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        # Test the core package alone and with the optional search and CMS layers
        extras: ["", "[all]"]

    services:
      postgres:
        image: postgis/postgis:14-3.2
        env:
          POSTGRES_DB: django_councilmatic
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install gdal-bin libreoffice unoconv
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements.txt
          pip install -e ".${{ matrix.extras }}"
      - name: Test with pytest
        run: |
          flake8 councilmatic_core councilmatic_search councilmatic_cms tests
          black --check councilmatic_core councilmatic_search councilmatic_cms tests --exclude "/migrations/"
          pytest
